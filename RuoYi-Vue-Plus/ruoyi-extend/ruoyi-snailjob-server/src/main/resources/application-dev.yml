# 文件用途：维护“application-dev.yml”对应服务的环境配置与组件参数绑定。
# 文件版本：1.0.0
# 功能目的：维护“application-dev.yml”对应服务的环境配置与组件参数绑定。
# 设计思路：按 profile 管理环境差异，敏感配置从环境变量读取。
# 实现方法：Spring Boot 按 profile 加载并注入服务；可选依赖不可用时需遵循实际配置策略。
# 关键约束：不能提交本机口令、令牌或私有地址。
# 依赖与引用：.env.example；Docs/规范/部署与迁移.md
# 初始开发人员：上游原作者/许可证：保留源文件既有声明；本项目改造责任人：JY
# 初始开发时间：待追溯（不以补录时间代替原始开发时间）
# 当前责任人：JY（项目维护责任；框架文件仅限项目改造范围）
# 最近修改人员：JY
# AI辅助工具：Codex（智能体）
# 最近修改时间：2026-11-20
# 修改标记：ZY-ERP-20261120-注释整理；补齐文件说明和业务逻辑注释，不改变运行行为
# 最近测试时间：本次整理未执行功能测试
# 测试人员：本次整理未执行
# 测试状态：待功能回归；历史测试记录待追溯
# 测试范围与记录位置：本次为注释/元信息整理；见 Docs/功能任务/ZY-ERP-20261120-既有功能注释整理.md
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SNAILJOB_DB_HOST:127.0.0.1}:${SNAILJOB_DB_PORT:5432}/${SNAILJOB_DB_NAME:zhizhun_snailjob}
    username: ${SNAILJOB_DB_USER:snailjob_app}
    password: ${SNAILJOB_DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 900000
      keepaliveTime: 30000

server:
  # WSL 开发端口只绑定本机，供同机 Windows 浏览器通过 localhost 转发访问。
  address: ${SNAILJOB_BIND_ADDRESS:127.0.0.1}

--- # snail-job 服务端配置
snail-job:
  # 服务端节点IP(默认按照`NetUtil.getLocalIpStr()`)
  server-host: ${SNAILJOB_SERVER_HOST:127.0.0.1}
  # 服务端端口号
  server-port: 17888
  # 合并日志默认保存天数
  merge-Log-days: 1
  # 合并日志默认的条数
  merge-Log-num: 500
  # 配置每批次拉取重试数据的大小
  retry-pull-page-size: 100
  # 配置日志保存时间（单位：天）
  log-storage: 7
  # bucket的总数量
  bucket-total: 128
  # Dashboard 任务容错天数
  summary-day: 7
  # 配置负载均衡周期时间
  load-balance-cycle-time: 10
  # 重试任务拉取的并行度
  retry-max-pull-parallel: 2

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${SUPER_ADMIN_USERNAME}
  password: ${SUPER_ADMIN_PASSWORD}
