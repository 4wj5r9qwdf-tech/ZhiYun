spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SNAILJOB_DB_HOST:127.0.0.1}:${SNAILJOB_DB_PORT:5432}/${SNAILJOB_DB_NAME:zhizhun_snailjob}
    username: ${SNAILJOB_DB_USER:snailjob_app}
    password: ${SNAILJOB_DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 900000
      keepaliveTime: 30000

server:
  # WSL 开发端口只绑定本机，供同机 Windows 浏览器通过 localhost 转发访问。
  address: ${SNAILJOB_BIND_ADDRESS:127.0.0.1}

--- # snail-job 服务端配置
snail-job:
  # 服务端节点IP(默认按照`NetUtil.getLocalIpStr()`)
  server-host: ${SNAILJOB_SERVER_HOST:127.0.0.1}
  # 服务端端口号
  server-port: 17888
  # 合并日志默认保存天数
  merge-Log-days: 1
  # 合并日志默认的条数
  merge-Log-num: 500
  # 配置每批次拉取重试数据的大小
  retry-pull-page-size: 100
  # 配置日志保存时间（单位：天）
  log-storage: 7
  # bucket的总数量
  bucket-total: 128
  # Dashboard 任务容错天数
  summary-day: 7
  # 配置负载均衡周期时间
  load-balance-cycle-time: 10
  # 重试任务拉取的并行度
  retry-max-pull-parallel: 2

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${SUPER_ADMIN_USERNAME}
  password: ${SUPER_ADMIN_PASSWORD}
