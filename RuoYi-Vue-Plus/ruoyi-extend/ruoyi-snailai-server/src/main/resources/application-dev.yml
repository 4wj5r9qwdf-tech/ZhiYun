spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SNAILAI_DB_HOST:127.0.0.1}:${SNAILAI_DB_PORT:5432}/${SNAILAI_DB_NAME:zhizhun_snailai}
    username: ${SNAILAI_DB_USER:snailai_app}
    password: ${SNAILAI_DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 900000
      keepaliveTime: 30000

server:
  # WSL 开发端口只绑定本机，供同机 Windows 浏览器通过 localhost 转发访问。
  address: ${SNAILAI_BIND_ADDRESS:127.0.0.1}

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${SUPER_ADMIN_USERNAME}
  password: ${SUPER_ADMIN_PASSWORD}

--- # 本地体验设置
snail-ai:
  # 本地体验不依赖尚未部署的文档解析与 OCR 服务。
  rag:
    docling:
      enabled: ${SNAIL_AI_RAG_DOCLING_ENABLED:false}
      paddle-ocr-enabled: false
