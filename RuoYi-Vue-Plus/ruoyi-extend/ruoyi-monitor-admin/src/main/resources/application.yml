# 文件用途：维护“application.yml”对应服务的环境配置与组件参数绑定。
# 文件版本：1.0.0
# 功能目的：维护“application.yml”对应服务的环境配置与组件参数绑定。
# 设计思路：按 profile 管理环境差异，敏感配置从环境变量读取。
# 实现方法：Spring Boot 按 profile 加载并注入服务；可选依赖不可用时需遵循实际配置策略。
# 关键约束：不能提交本机口令、令牌或私有地址。
# 依赖与引用：.env.example；Docs/规范/部署与迁移.md
# 初始开发人员：上游原作者/许可证：保留源文件既有声明；本项目改造责任人：JY
# 初始开发时间：待追溯（不以补录时间代替原始开发时间）
# 当前责任人：JY（项目维护责任；框架文件仅限项目改造范围）
# 最近修改人员：JY
# AI辅助工具：Codex（智能体）
# 最近修改时间：2026-11-20
# 修改标记：ZY-ERP-20261120-注释整理；补齐文件说明和业务逻辑注释，不改变运行行为
# 最近测试时间：本次整理未执行功能测试
# 测试人员：本次整理未执行
# 测试状态：待功能回归；历史测试记录待追溯
# 测试范围与记录位置：本次为注释/元信息整理；见 Docs/功能任务/ZY-ERP-20261120-既有功能注释整理.md
server:
  port: 9090
spring:
  application:
    name: ruoyi-monitor-admin
  profiles:
    active: @profiles.active@

logging:
  config: classpath:logback-plus.xml

--- # 监控中心服务端配置
spring:
  security:
    user:
      # 使用 ERP 超管环境变量；不在框架构建配置中保存独立监控明文凭据。
      name: ${SUPER_ADMIN_USERNAME}
      password: ${SUPER_ADMIN_PASSWORD}
  boot:
    admin:
      ui:
        title: RuoYi-Vue-Plus服务监控中心
      context-path: /admin
  # 忽略无用警告
  thymeleaf:
    check-template-location: false

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/ruoyi-monitor-admin.log

--- # 监控配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  # 设置 Spring Boot Admin Server 地址
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${SUPER_ADMIN_USERNAME}
  password: ${SUPER_ADMIN_PASSWORD}
