services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    container_name: spring-ai-alibaba-elasticsearch
    restart: unless-stopped
    user: "${SAA_UID:-1000}:${SAA_GID:-1000}"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.name: spring-ai-alibaba-test
      node.name: saa-test-es
      bootstrap.memory_lock: "true"
      action.destructive_requires_name: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 127.0.0.1:19200:9200
    volumes:
      - ../../.runtime/spring-ai-alibaba/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [spring-ai-alibaba-test]

  elasticsearch-init:
    image: curlimages/curl:8.12.1
    container_name: spring-ai-alibaba-elasticsearch-init
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ../../third_party/spring-ai-alibaba/spring-ai-alibaba-admin/docker/middleware/init/elasticsearch:/scripts:ro
    working_dir: /scripts
    command: [sh, init-indices.sh]
    networks: [spring-ai-alibaba-test]

  nacos:
    image: nacos/nacos-server:latest
    container_name: spring-ai-alibaba-nacos
    restart: unless-stopped
    user: "${SAA_UID:-1000}:${SAA_GID:-1000}"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN must be generated by the startup script}"
      NACOS_AUTH_IDENTITY_KEY: "${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY must be generated by the startup script}"
      NACOS_AUTH_IDENTITY_VALUE: "${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE must be generated by the startup script}"
    ports:
      - 127.0.0.1:18848:8848
      - 127.0.0.1:19848:9848
    volumes:
      - ../../.runtime/spring-ai-alibaba/nacos/logs:/home/nacos/logs
      - ../../.runtime/spring-ai-alibaba/nacos/data:/home/nacos/data
    networks: [spring-ai-alibaba-test]

  rmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: spring-ai-alibaba-rmq-namesrv
    restart: unless-stopped
    user: "3000:3000"
    environment:
      NAMESRV_ADDR: rmq-namesrv:9876
      HEAP_OPTS: -Xms128M -Xmx256M -Xmn128M
    ports:
      - 127.0.0.1:19876:9876
    command: [sh, mqnamesrv]
    healthcheck:
      test: [CMD-SHELL, "ps aux | grep mqnamesrv | grep -v grep || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [spring-ai-alibaba-test]

  rmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: spring-ai-alibaba-rmq-broker
    restart: unless-stopped
    user: "3000:3000"
    environment:
      NAMESRV_ADDR: rmq-namesrv:9876
      HEAP_OPTS: -Xms256M -Xmx512M -Xmn256M -XX:MaxDirectMemorySize=128M
    volumes:
      - ../../.runtime/spring-ai-alibaba/rocketmq/store:/home/rocketmq/store
    ports:
      - 127.0.0.1:11909:10909
      - 127.0.0.1:11911:10911
      - 127.0.0.1:11912:10912
    depends_on:
      rmq-namesrv:
        condition: service_healthy
    command: [sh, mqbroker]
    healthcheck:
      test: [CMD-SHELL, "ps aux | grep mqbroker | grep -v grep || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [spring-ai-alibaba-test]

  rmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: spring-ai-alibaba-rmq-proxy
    restart: unless-stopped
    user: "3000:3000"
    environment:
      NAMESRV_ADDR: rmq-namesrv:9876
      HEAP_OPTS: -Xms128M -Xmx256M -Xmn128M
    volumes:
      - ../../third_party/spring-ai-alibaba/spring-ai-alibaba-admin/docker/middleware/conf/rocketmq:/home/rocketmq/conf:ro
    depends_on:
      rmq-broker:
        condition: service_healthy
      rmq-namesrv:
        condition: service_healthy
    ports:
      - 127.0.0.1:18080:18080
      - 127.0.0.1:18081:18081
    command: [sh, mqproxy, -pc, /home/rocketmq/conf/rmq-proxy.json]
    networks: [spring-ai-alibaba-test]

  rmq-init-topic:
    image: apache/rocketmq:5.3.2
    container_name: spring-ai-alibaba-rmq-init-topic
    restart: "no"
    depends_on:
      rmq-namesrv:
        condition: service_healthy
      rmq-broker:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        sleep 30 &&
        until sh mqadmin clusterList -n rmq-namesrv:9876; do sleep 5; done &&
        sh mqadmin updateTopic -n rmq-namesrv:9876 -t topic_saa_studio_document_index -c DefaultCluster -a +message.type=NORMAL &&
        sh mqadmin updateSubGroup -n rmq-namesrv:9876 -g group_saa_studio_document_index -c DefaultCluster
    networks: [spring-ai-alibaba-test]

  loongcollector:
    image: sls-opensource-registry.cn-shanghai.cr.aliyuncs.com/loongcollector-community-edition/loongcollector:3.1.4
    container_name: spring-ai-alibaba-loongcollector
    restart: unless-stopped
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    volumes:
      - ./loongcollector.yaml:/usr/local/loongcollector/conf/continuous_pipeline_config/local/loongcollector.yaml:ro
    ports:
      - 127.0.0.1:14318:4318
    networks: [spring-ai-alibaba-test]

networks:
  spring-ai-alibaba-test:
    name: spring-ai-alibaba-test
    driver: bridge
